[package]
name = "tk-light-screen-sender"
version = "0.1.0"
edition = "2021"
description = "Small Windows screen publisher for the tk-light control server"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }
