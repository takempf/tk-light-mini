[package]
name = "tk-light-mini"
version = "0.1.0"
description = "Screen-reactive ambient lighting for Govee LAN devices"
authors = ["kempf"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "tk_light_mini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
if-addrs = "0.15"
parking_lot = "0.12"
base64 = "0.22"
tauri-plugin-dialog = "2"
# PC lights through iCUE: its SDK DLL is loaded at runtime.
libloading = "0.9"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
