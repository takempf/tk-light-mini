[package]
name = "tk-light-mini"
version = "0.1.0"
description = "Screen-reactive ambient lighting for Govee LAN devices"
authors = ["kempf"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "tk_light_mini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
if-addrs = "0.15"
parking_lot = "0.12"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
